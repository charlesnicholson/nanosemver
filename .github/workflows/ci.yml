name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    # A release is tag-driven: the whole matrix runs against the tag, and only if it
    # passes does the release job publish.
    tags: [ 'v*' ]
  schedule:
    - cron: '0 2 * * 0'  # weekly
  workflow_dispatch:

# Supersede a pull request's earlier runs when it is pushed to again. head_ref is only
# set for pull requests, so pushes, tags and the cron fall through to run_id, get a
# group to themselves, and are never cancelled: a tag push has to reach the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # The workflow and release plumbing: the checked-in header stays unversioned, the
  # script that stamps it works, and the gate below waits on every job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: all-checks-pass needs every job
        run: |
          wf=.github/workflows/ci.yml
          diff <(yq -r '.jobs | keys | .[]' "$wf" | grep -vx -e all-checks-pass -e release | sort) \
               <(yq -r '.jobs["all-checks-pass"].needs[]' "$wf" | sort)
      - name: Placeholder intact
        run: ./release.sh --check
      - name: Dry run
        run: |
          test "$(./release.sh v12.34.56-ci.7 build/release)" = prerelease
          head -1 build/release/nanosemver.h | grep -q '^/\* nanosemver v12.34.56-ci.7:'
          printf '%s\n' '#include "nanosemver.h"' \
            '#if NSV_VERSION_MAJOR != 12 || NSV_VERSION_MINOR != 34 || NSV_VERSION_PATCH != 56' \
            '#error the version macros are not stamped' '#endif' > build/release/stamp.c
          cc -std=c99 -Wall -Werror -c build/release/stamp.c -o /dev/null
          grep -qx '#define NSV_VERSION "12.34.56-ci.7"' build/release/nanosemver.h
          head -1 build/release/nanosemver.hpp | grep -q '^/\* nanosemver v12.34.56-ci.7:'
          printf '%s\n' '#include "nanosemver.hpp"' > build/release/stamp.cc
          c++ -std=c++11 -Wall -Werror -fno-exceptions -fno-rtti -c build/release/stamp.cc -o /dev/null
          # A stamped nanosemver.hpp refuses another release's nanosemver.h: the checked-in
          # one, and one that differs only in the pre-release. Not `! c++ ...`, which bash -e
          # never stops on.
          ./release.sh v12.34.56 build/release-final > /dev/null
          for h in nanosemver.h build/release-final/nanosemver.h; do
            mkdir -p build/release/mixed
            cp "$h" build/release/nanosemver.hpp build/release/stamp.cc build/release/mixed/
            if c++ -std=c++11 -c build/release/mixed/stamp.cc -o /dev/null 2>/dev/null; then
              echo "the v12.34.56-ci.7 nanosemver.hpp built against $h" >&2
              exit 1
            fi
          done
          unzip -l build/release/nanosemver-v12.34.56-ci.7.zip
          unzip -p build/release/nanosemver-v12.34.56-ci.7.zip nanosemver-v12.34.56-ci.7/nanosemver.h \
            | cmp - build/release/nanosemver.h
          unzip -p build/release/nanosemver-v12.34.56-ci.7.zip nanosemver-v12.34.56-ci.7/nanosemver.hpp \
            | cmp - build/release/nanosemver.hpp
          unzip -l build/release/nanosemver-v12.34.56-ci.7.zip | grep -q 'tests/test_parse.cc'
          unzip -l build/release/nanosemver-v12.34.56-ci.7.zip | grep -q 'nanosemver.hpp'
          cat build/release/release_notes.md

  linux:
    name: linux (${{ matrix.cc }}, ${{ matrix.cfg }}, ${{ matrix.arch }}-bit)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
        cfg: [ Release, Debug ]
        arch: [ 32, 64 ]
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Build and test
        run: make -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} CFG=${{ matrix.cfg }} ARCH=${{ matrix.arch }}

  linux-arm64:
    name: linux-arm64 (${{ matrix.cc }})
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Build and test
        run: make -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

  sanitizers:
    name: sanitizer (${{ matrix.cc }}, ${{ matrix.san }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: clang, cxx: clang++, san: 'address,undefined' }
          - { cc: clang, cxx: clang++, san: memory }
          - { cc: gcc, cxx: g++, san: 'address,undefined' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Build and test
        run: make -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} SAN=${{ matrix.san }}

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: 100% of nanosemver.c, in both int configurations
        run: make -j"$(nproc)" CC=clang CXX=clang++ coverage
      - name: Annotated source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/*.txt
          if-no-files-found: ignore

  fuzz:
    name: fuzz (${{ matrix.kind }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: libFuzzer
            run: make CC=clang CXX=clang++ libfuzzer LIBFUZZER_ARGS=-max_total_time=120
          - kind: standalone, asan+ubsan
            run: make CC=clang CXX=clang++ SAN=address,undefined fuzz FUZZ_ARGS="-t 120"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Fuzz
        run: ${{ matrix.run }} -j"$(nproc)"
      - name: Keep any crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash
          path: |
            crash-*
            build/libfuzzer/corpus
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Build and test
        run: make -j"$(sysctl -n hw.ncpu)"
      - name: Build and test (asan+ubsan)
        run: make -j"$(sysctl -n hw.ncpu)" SAN=address,undefined

  windows:
    name: windows (msvc, ${{ matrix.arch }}-bit)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ 32, 64 ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Build and test
        shell: cmd
        env:
          FUZZ_ARGS: -t 30
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Could not locate a Visual Studio installation via vswhere 1>&2
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars${{ matrix.arch }}.bat" || exit /b 1
          call build.bat fuzz

  # The ratchet, Cortex-M code size and cycles per call held to size-budget.mk and
  # bench/cm/ratchet.txt: emulated counts are exact, so it gates. Then the benchmarks
  # against main, which do not: the host timings are a shared runner's, and a deliberate
  # behavior change makes their checksums differ.
  embedded:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the benchmarks build origin/main's nanosemver.c
      - uses: actions/cache@v6
        with:
          path: |
            build/envy-cache
            build/uv-cache
          key: embedded-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua', 'bench/cm/cmcount.py') }}
      - name: Code size
        run: make size
      - name: The ratchet, and nothing from libc or libgcc but memcpy
        run: make ratchet
      # checkout trusts the workspace only for its own git calls; the container's user
      # does not own it, so `git show origin/main:...` needs the exception too.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # bash, for pipefail: a failed make must not hide behind tee.
      - name: Cortex-M instruction counts against main
        continue-on-error: true
        shell: bash
        run: |
          { echo '### Cortex-M, emulated'; echo '```'; make -s bench-cm; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Host timings against main
        continue-on-error: true
        shell: bash
        run: |
          { echo '### Host, gcc -O2'; echo '```'; make -s bench CC=gcc CXX=g++ BENCH_ARGS=--quick; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # nsv_range_match against npm's own semver package. No standard defines ranges; npm's
  # grammar is the nearest thing, and nanosemver's is a subset of it.
  npm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua', 'envy/local.node.lua') }}
      - name: Against node-semver
        run: make npm-check NPM_ARGS="1000000 1"

  # Mutation testing: every change to nanosemver.c the unit tests do not catch is either
  # explained in tests/mutate-equivalent.txt or a failure. Eight shards, each every
  # eighth mutant, keep it to a few minutes.
  mutate:
    name: mutate (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            build/envy-cache
            build/uv-cache
          key: mutate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('envy.lua') }}
      - name: Mutants of nanosemver.c
        run: make -j"$(nproc)" mutate MUTATE_ARGS="--jobs $(nproc) --shard ${{ matrix.shard }}/8"

  # The DOCTEST_H opt-out: no container, no envy, the runner's own compilers.
  without-envy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: doctest.h
        run: |
          mkdir -p "${RUNNER_TEMP}/doctest"
          curl -fsSL -o "${RUNNER_TEMP}/doctest/doctest.h" \
            https://raw.githubusercontent.com/doctest/doctest/v2.5.3/doctest/doctest.h
      - name: Build and test
        run: make -j"$(nproc)" DOCTEST_H="${RUNNER_TEMP}/doctest/doctest.h"
      - name: envy was never invoked
        run: test ! -d build/envy-cache

  # The one required status check. always(), so it reports even when a job it needs
  # fails; otherwise it would be skipped, and a skipped required check reads as passing.
  # Nothing above is skipped on purpose, so a skip is a failure too. The lint job
  # checks that this list names every job.
  all-checks-pass:
    needs: [ lint, linux, linux-arm64, sanitizers, coverage, fuzz, macos, windows,
             embedded, npm, mutate, without-envy ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: echo "A required job did not pass." && exit 1
      - run: echo Done

  # An if: without a status function implies success(), so this runs only after
  # all-checks-pass succeeds.
  release:
    needs: [ all-checks-pass ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Stamps the tag into the header, zips it with the rest of the source, and writes
      # the asset notes. Run it locally to see exactly what a tag would ship.
      - name: Prepare the release assets
        id: assets
        run: echo "kind=$(./release.sh "${GITHUB_REF_NAME}" build/release)" >> "$GITHUB_OUTPUT"

      # Idempotent, so a re-run after a partial failure still completes. A tag with a
      # pre-release (v1.2.0-rc.1) is published as a GitHub pre-release. The asset notes
      # go first; GitHub's list of merged pull requests follows.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.assets.outputs.kind == 'prerelease' && '--prerelease' || '' }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file build/release/release_notes.md \
            --generate-notes \
            ${PRERELEASE:+"$PRERELEASE"} \
            "build/release/nanosemver-${GITHUB_REF_NAME}.zip" \
            build/release/nanosemver.h \
            build/release/nanosemver.c \
            build/release/nanosemver.hpp
